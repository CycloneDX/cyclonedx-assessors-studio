# =============================================================================
# CycloneDX Assessors Studio - CI Pipeline
# =============================================================================
# Security hardening:
#   - All actions pinned to full commit SHAs (not tags)
#   - Top-level permissions deny-all; each job grants minimum needed
#   - persist-credentials: false on every checkout
#   - npm ci with frozen lockfile (no mutation)
#   - No use of pull_request_target
#   - No credential exposure to PR builds (history-guard reads one non-credential pattern secret)
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Deny all permissions by default.  Each job opts in to exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Backend
  # ---------------------------------------------------------------------------
  backend-build:
    name: "Backend / Build & Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read          # checkout only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      # argon2 requires a native build step; run it explicitly after npm ci
      - name: Rebuild native modules
        run: npm rebuild argon2

      - name: Typecheck
        run: npx tsc --noEmit

      # Unused files and dependencies (see knip.jsonc). Unused exports are
      # not checked: module barrels and the event catalog export on purpose.
      - name: Unused files and dependencies
        run: npx --yes knip@6.41.0 --no-progress --include files,dependencies,unlisted,unresolved,binaries

      - name: Lint (if configured)
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yml ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "No ESLint config found, skipping"
          fi

  backend-test:
    name: "Backend / Test"
    runs-on: ubuntu-latest
    # The suite runs files serially (fileParallelism: false) with coverage;
    # 2107 of ~2480 tests passed in the first 10 min of CI run #1.
    timeout-minutes: 20
    needs: backend-build
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        run: npm rebuild argon2

      - name: Run tests with coverage
        run: npx vitest run --reporter=verbose --coverage
        env:
          DATABASE_PROVIDER: pglite
          PGLITE_DATA_DIR: ./data/test-pglite
          JWT_SECRET: ci-testing-secret-that-is-at-least-32-characters-long
          PORT: "3001"
          LOG_LEVEL: error
          CORS_ORIGIN: http://localhost:5173

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  frontend-build:
    name: "Frontend / Build & Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      - name: Typecheck
        run: npx vue-tsc -b

      # Unused files and dependencies (see knip.jsonc). Unused exports are
      # not checked: module barrels and the event catalog export on purpose.
      - name: Unused files and dependencies
        run: npx --yes knip@6.41.0 --no-progress --include files,dependencies,unlisted,unresolved,binaries

      - name: Lint (if configured)
        run: |
          if [ -f .eslintrc.js ] || [ -f .eslintrc.json ] || [ -f .eslintrc.yml ] || [ -f eslint.config.js ] || [ -f eslint.config.mjs ]; then
            npx eslint .
          else
            echo "No ESLint config found, skipping"
          fi

      - name: Production build
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 5
          if-no-files-found: error

  # Every frontend API call must go through src/api/client.ts (401/503
  # handling). Runs the root ESLint config with complexity off: complexity
  # is checked separately on changed files, not as a CI blocker.
  # --no-inline-config so an eslint-disable comment cannot bypass the ban.
  frontend-api-imports:
    name: "Frontend / API import guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install lint dependencies
        run: npm ci --ignore-scripts

      - name: Ban direct axios imports
        run: npx eslint frontend/src --rule '{"complexity":"off"}' --no-inline-config

  frontend-test:
    name: "Frontend / Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-build
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npx vitest run --reporter=verbose --coverage.enabled --coverage.reporter=text --coverage.reporter=lcov --coverage.reportsDirectory=./coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 5
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # E2E (Playwright) — gated behind a green backend AND frontend build+test.
  # Boots backend (PGlite) and frontend (vite dev) in-process, walks the
  # setup wizard, seeds demo data, captures per-role storage states, and
  # runs the Playwright suite on chromium. Smoke-tagged subset also runs
  # on firefox/webkit. See tests/e2e/PLAN.md for the multi-phase plan.
  # ---------------------------------------------------------------------------
  e2e:
    name: "E2E / Playwright"
    # Pinned: Playwright's WebKit build links against the image's ICU, and
    # ubuntu-latest moving to 26.04 broke the browsers cached on 24.04.
    runs-on: ubuntu-24.04
    # A run without the browser cache spends 18-25 min downloading
    # Chromium, Firefox and WebKit before the ~7 min suite starts; 25 min
    # cancelled every cold run (first runs in a new repository).
    timeout-minutes: 45
    needs: [backend-build, backend-test, frontend-build, frontend-test]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      - name: Rebuild backend native modules
        working-directory: backend
        run: npm rebuild argon2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
        env:
          NODE_ENV: development

      - name: Install e2e dependencies
        working-directory: tests/e2e
        run: npm ci --ignore-scripts

      # Cache the Playwright browser binaries by Playwright version so
      # that recurring CI runs do not re-download ~300 MB of WebKit and
      # Firefox bundles on every commit.
      - name: Get Playwright version
        id: pw-version
        working-directory: tests/e2e
        run: |
          PW_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

      # Restore and save are separate steps so the browsers are cached as
      # soon as they are downloaded. With the combined action the cache is
      # saved only at the end of a successful job, so a cold run that timed
      # out or failed never warmed it.
      - name: Restore Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers and OS deps
        working-directory: tests/e2e
        # `--with-deps` ensures Ubuntu pulls the libs Chromium/WebKit need.
        # When the cache hit, only the OS deps step runs (fast).
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" != 'true' ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install-deps chromium firefox webkit
          fi

      - name: Save Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.pw-version.outputs.version }}

      - name: Typecheck e2e
        working-directory: tests/e2e
        run: npx tsc --noEmit

      - name: Run Playwright suite
        working-directory: tests/e2e
        env:
          CI: 'true'
          # PGlite is the embedded provider; tests run against a fresh
          # data directory under tests/e2e/data so each CI run starts
          # from a known-empty state.
          E2E_PGLITE_DIR: ./data/pglite-e2e
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
          if-no-files-found: warn

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-traces
          path: tests/e2e/test-results
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Codacy coverage (main branch only) - upload coverage from test jobs
  # ---------------------------------------------------------------------------
  codacy-coverage:
    name: "Codacy / Upload Coverage"
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-test, frontend-test]
    permissions:
      contents: read
    # Secrets cannot appear in an `if:` directly. Without a Codacy project
    # token (this fork has none) the job skips its steps instead of failing.
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}

    steps:
      - name: Codacy not configured
        if: env.HAS_CODACY_TOKEN != 'true'
        run: echo "CODACY_PROJECT_TOKEN is not set; skipping the coverage upload."

      - name: Download backend coverage
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: backend-coverage
          path: backend-coverage
        if: env.HAS_CODACY_TOKEN == 'true'

      - name: Download frontend coverage
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3  # v8.0.0
        with:
          name: frontend-coverage
          path: frontend-coverage
        continue-on-error: true
        if: env.HAS_CODACY_TOKEN == 'true'

      - name: Resolve coverage report paths
        id: coverage-paths
        if: env.HAS_CODACY_TOKEN == 'true'
        run: |
          REPORTS=""
          if [ -f backend-coverage/lcov.info ]; then
            REPORTS="backend-coverage/lcov.info"
          fi
          if [ -f frontend-coverage/lcov.info ]; then
            if [ -n "$REPORTS" ]; then
              REPORTS="$REPORTS,frontend-coverage/lcov.info"
            else
              REPORTS="frontend-coverage/lcov.info"
            fi
          fi
          echo "reports=$REPORTS" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codacy
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage-paths.outputs.reports != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage-paths.outputs.reports }}

  # ---------------------------------------------------------------------------
  # Dependency review (PR only) - block PRs that introduce known vulns
  # ---------------------------------------------------------------------------
  # GitHub only runs dependency review on a private repository with
  # Advanced Security, so it is skipped while this repo is private;
  # dependency-audit below covers known vulnerabilities either way.
  dependency-review:
    name: "Dependency Review"
    if: github.event_name == 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write   # post review comments

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-3.0
          comment-summary-in-pr: always

  # ---------------------------------------------------------------------------
  # Dependency audit - fail on high/critical advisories in production deps.
  # Runs on every event and needs no GitHub Advanced Security.
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: "Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .node-version

      # Reads the committed lockfile; installs nothing.
      - name: npm audit (production dependencies)
        working-directory: ${{ matrix.workspace }}
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # History guard - gitleaks over the commits this event adds, plus a check
  # for names that must stay in this fork. The names come from the
  # NAME_GUARD_REGEX secret so they never enter the repository; it is not a
  # credential, and forks and upstream (no secret) skip that check.
  # ---------------------------------------------------------------------------
  history-guard:
    name: "History Guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # push: the commits since the previous tip. pull_request: the PR's
      # commits. workflow_dispatch: no base, so the whole history.
      - name: Scan
        env:
          NAME_GUARD_REGEX: ${{ secrets.NAME_GUARD_REGEX }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/history-guard.sh "$BASE_SHA" "$HEAD_SHA"

  # ---------------------------------------------------------------------------
  # Docker snapshot (main branch only) - build and push snapshot image
  #
  # Publishes a single image that serves both the Vue 3 SPA and the
  # JSON API on the same origin:
  #   ghcr.io/<owner>/<repo>:snapshot
  # ---------------------------------------------------------------------------
  docker:
    name: "Docker / Snapshot"
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Snapshot images may only be pushed once the full pipeline is green,
    # including E2E. Add e2e to the gate so a broken UI flow cannot be
    # published.
    needs: [backend-test, frontend-test, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      # The fork publishes to its own GitHub Container Registry with the
      # job's GITHUB_TOKEN; it never pushes to upstream's Docker Hub repo.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push snapshot image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:snapshot
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
